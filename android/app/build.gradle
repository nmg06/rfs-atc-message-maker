plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.nmg06.rfsatc'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nmg06.rfsatc'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.4.1-flightdeck'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Launcher component changes are tested in a separate final invocation.
        // Android may restart a task when the package-change broadcast arrives.
        testInstrumentationRunnerArguments class: 'com.nmg06.rfsatc.OfflineAppTest#launchEngineDatabaseFinderFuelAndRestartWithoutInternetPermission,com.nmg06.rfsatc.OfflineAppTest#nativeClipboardUsesEditedPreviewExactly,com.nmg06.rfsatc.OfflineAppTest#offlineMapRendersLocalBordersRouteAndCountrySelection,com.nmg06.rfsatc.OfflineAppTest#viewportIsOutsideSystemBarsAndCutout'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir "$buildDir/generated/assets"
    buildFeatures { buildConfig true }
    buildTypes.release { minifyEnabled false }
    packaging.resources.excludes += ['META-INF/DEPENDENCIES']
}
chaquopy {
    defaultConfig {
        version '3.11'
        if (System.getenv('RFS_BUILD_PYTHON')) { buildPython System.getenv('RFS_BUILD_PYTHON') }
        pip { install 'tzdata==2026.4' }
    }
    sourceSets.main.srcDir "$buildDir/generated/python"
}
tasks.register('prepareSharedEngine', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine(System.getenv('RFS_BUILD_PYTHON') ?: 'python', 'scripts/prepare_android.py')
    inputs.files(fileTree(rootProject.projectDir.parentFile) {
        include '*.py', 'finder/*.py', 'fuel/*.py', 'docs/fuel/reference/*.json', 'assets/world_countries.json', 'assets/WORLD_MAP_LICENSE.md', 'assets/help-ui.*', 'scripts/prepare_android.py', 'scripts/export_help.py', 'scripts/export_web_fuel.py'
    }, fileTree(rootProject.file('bundled')))
    outputs.dir "$buildDir/generated"
}
tasks.configureEach {
    if (name.startsWith('generate') && name.endsWith('PythonRequirements') || name.contains('PythonSources') || name == 'mergeDebugAssets' || name == 'mergeReleaseAssets') {
        dependsOn 'prepareSharedEngine'
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareSharedEngine' }
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
