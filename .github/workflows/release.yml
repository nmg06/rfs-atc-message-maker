name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build standalone executable with PyInstaller
        run: python -m PyInstaller --noconfirm --clean --distpath dist RFSATCMessageMaker.spec

      - name: Package release files
        shell: pwsh
        run: |
          # Copy extra folders into dist/RFSATCMessageMaker
          if (Test-Path "finder-data/aviation.sqlite") {
            New-Item -ItemType Directory -Force -Path "dist/RFSATCMessageMaker/finder-data"
            Copy-Item -Path "finder-data/aviation.sqlite" -Destination "dist/RFSATCMessageMaker/finder-data" -Force
          }
          if (Test-Path "docs") {
            Copy-Item -Path "docs" -Destination "dist/RFSATCMessageMaker/docs" -Recurse -Force
          }
          if (Test-Path "licenses") {
            Copy-Item -Path "licenses" -Destination "dist/RFSATCMessageMaker/licenses" -Recurse -Force
          }
          Copy-Item -Path "README.md" -Destination "dist/RFSATCMessageMaker" -Force
          
          # Create zip
          Compress-Archive -Path "dist/RFSATCMessageMaker" -DestinationPath "RFSATCMessageMaker-Windows-x64.zip" -Force
          Write-Host "Archive created: RFSATCMessageMaker-Windows-x64.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: RFSATCMessageMaker-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload Build Artifact (for manual workflow runs)
        uses: actions/upload-artifact@v4
        with:
          name: RFSATCMessageMaker-Windows-x64
          path: RFSATCMessageMaker-Windows-x64.zip
          retention-days: 30

  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare public website only
        run: python scripts/prepare_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
