name: Tests and dependency checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt -r requirements-etl.txt pip-audit bandit
      - name: Test application
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Audit installed dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Static Python security checks
        run: python -m bandit -r . -x ./.venv,./tests,./build,./dist -ll
      - name: Build standalone Windows application
        run: python -m PyInstaller --noconfirm --distpath dist RFSATCMessageMaker.spec
