name: Flightdeck Windows test package
on:
  push:
    branches: ['feat/flightdeck-map-performance']
  pull_request:
    paths: ['route_map.py', 'map_online.py', 'flightdeck.py', 'aircraft_picker.py', 'assets/world_countries.json', 'scripts/package_windows.py', '.github/workflows/flightdeck.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Build isolated application
        run: python -m PyInstaller --noconfirm --clean RFSATCMessageMaker.spec
      - name: Include verified offline public data
        run: python scripts/package_windows.py
      - name: Test packaged startup, local Finder, fuel and map resources
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:RFS_MESSAGE_MAKER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'flightdeck-smoke'
          $process = Start-Process -FilePath '.\dist\RFSATCMessageMaker\RFSATCMessageMaker.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged smoke failed: $($process.ExitCode)" }
          if (!(Test-Path (Join-Path $env:RFS_MESSAGE_MAKER_DATA_DIR 'smoke-result.json'))) { throw 'Smoke result missing' }
          Get-Content (Join-Path $env:RFS_MESSAGE_MAKER_DATA_DIR 'smoke-result.json')
      - uses: actions/upload-artifact@v4
        with:
          name: RFSFlightdeck-Windows-x64-test
          path: dist/RFSFlightdeck-Windows-x64-test.zip
          retention-days: 30
          if-no-files-found: error
