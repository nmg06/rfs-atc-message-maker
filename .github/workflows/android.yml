name: Android offline APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/android-*']
    paths: ['android/**', 'scripts/prepare_android.py', '*.py', 'finder/**', 'fuel/**', 'docs/fuel/reference/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/prepare_android.py', '*.py', 'finder/**', 'fuel/**', 'docs/fuel/reference/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: python -m pip install tzdata==2026.4
      - run: python scripts/prepare_android.py
      - name: Python parity and offline tests
        run: python -m unittest discover -s android/tests -v
      - name: JavaScript syntax
        run: node --check android/app/src/main/assets/www/app.js
      - name: Assemble installable debug APK and instrumented tests
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: RFS-ATC-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed Android offline integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: android/app/build/reports/androidTests/connected/
